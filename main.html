<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Verify Your Account</title>
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="container">
		<h1 id="verification_heading">Verify Your Account</h1>

		<p id="verification_subtext">We have sent a verification code to your email. Please enter the 6-digit code below to verify your account.
        </p>

		<div class="code-container">
			<input class="code" id="code-1" type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
			<input class="code" id="code-2" type="text" maxlength="1" inputmode="numeric">
			<input class="code" id="code-3" type="text" maxlength="1" inputmode="numeric">
			<input class="code" id="code-4" type="text" maxlength="1" inputmode="numeric">
			<input class="code" id="code-5" type="text" maxlength="1" inputmode="numeric">
			<input class="code" id="code-6" type="text" maxlength="1" inputmode="numeric">
		</div>
	</div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
